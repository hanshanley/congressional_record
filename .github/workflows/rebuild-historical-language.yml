name: Rebuild historical language

on:
  workflow_dispatch:
    inputs:
      audit_only:
        description: "Read-only source audit of every profanity family; do not change published counts"
        type: boolean
        default: false

concurrency:
  group: update-site
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "requirements*.txt"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Download canonical Stanford archives
        run: |
          mkdir -p data/raw
          curl -L -C - --fail --retry 20 --retry-all-errors --retry-delay 5 \
            -o data/raw/hein-bound.zip \
            https://stacks.stanford.edu/file/druid:md374tz9962/hein-bound.zip
          curl -L -C - --fail --retry 20 --retry-all-errors --retry-delay 5 \
            -o data/raw/hein-daily.zip \
            https://stacks.stanford.edu/file/druid:md374tz9962/hein-daily.zip

      - name: Verify canonical archives
        run: |
          python - <<'PY'
          from pathlib import Path

          expected = {
              "hein-bound.zip": 7_590_593_783,
              "hein-daily.zip": 2_817_259_858,
          }
          for name, size in expected.items():
              path = Path("data/raw") / name
              actual = path.stat().st_size
              if actual != size:
                  raise SystemExit(f"{name}: expected {size} bytes, got {actual}")
              print(name, actual, "bytes")
          PY
          # Generic ZIP readers overflow offsets in Stanford's >4 GB bound archive.
          # macOS ditto is the extraction path verified for this canonical file.
          ditto -x -k data/raw/hein-bound.zip data/raw
          test -f data/raw/hein-bound/043_SpeakerMap.txt
          test -f data/raw/hein-bound/speeches_111.txt
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from analysis.ingest.hein import available_congresses

          congresses = available_congresses(Path("data/raw/hein-bound"), "bound")
          if congresses != [f"{number:03d}" for number in range(43, 112)]:
              raise SystemExit(f"unexpected bound Congress coverage: {congresses}")

          with ZipFile("data/raw/hein-daily.zip") as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise SystemExit(f"hein-daily.zip: corrupt member {bad}")
          PY

      - name: Ingest Stanford and GovInfo corpora
        run: |
          rm data/raw/hein-bound.zip
          python -m analysis.run ingest-hein
          rm -r data/raw/hein-bound data/raw/hein-daily.zip
          python -m analysis.run ingest-govinfo-bulk \
            --start 2017-01-01 \
            --end "$(date -u +%F)" \
            --workers 12

      - name: Audit every profanity family against original historical transcripts
        run: |
          python scripts/audit_profanity_families.py \
            --turns data/interim/turns \
            --mode aggregate \
            --out audit/historical

      - name: Retain historical match evidence and disagreements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profanity-audit-historical
          path: audit/
          if-no-files-found: error
          retention-days: 30

      - name: Rebuild all aggregate language metrics
        if: ${{ !inputs.audit_only }}
        run: |
          python -m analysis.run aggregate --full
          python -m analysis.run viz

      - name: Retain checked historical publication inputs for recovery
        if: ${{ !inputs.audit_only }}
        uses: actions/upload-artifact@v4
        with:
          name: audited-historical-publication-inputs
          path: |
            data/processed/metrics/
            data/processed/coverage/
            data/reports/tables/
            outputs/figures/
          if-no-files-found: error
          retention-days: 30

      - name: Commit rebuilt historical data
        if: ${{ !inputs.audit_only }}
        run: |
          git config user.name "hanshanley"
          git config user.email "hwahhanley@gmail.com"
          git add data/site/long_run_language.json outputs/figures
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild audited historical language"
          fi

          # Rebase the data-only commit before generating the site so concurrent
          # presentation changes cannot conflict with stale generated HTML.
          git pull --rebase origin master
          python scripts/build_site.py
          python scripts/update_language.py --reset
          python scripts/build_term_graphs.py
          git add -A data/site site outputs/figures/profanity_terms
          if ! git diff --cached --quiet; then
            git commit -m "Refresh audited historical language site"
          fi
          if [[ "$(git rev-list --count origin/master..HEAD)" -gt 0 ]]; then
            git push
          fi
