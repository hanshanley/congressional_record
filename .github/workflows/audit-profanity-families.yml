name: Audit all profanity families

on:
  workflow_dispatch:
    inputs:
      congresses:
        description: "JSON array of Congresses to audit (allows targeted recovery)"
        type: string
        default: "[103,104,105,106,107,108,109,110,111,112,113,114,115,116,117,118,119]"
      save_candidates:
        description: "Retain checked replacement partitions as artifacts for review, without publishing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: profanity-source-audit-${{ join(fromJSON(inputs.congresses), '-') }}
  cancel-in-progress: false

jobs:
  members:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        congress: ${{ fromJSON(inputs.congresses) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "requirements*.txt"
      - run: pip install -r requirements-dev.txt
      - name: Test every codebook form and independent matcher
        run: python -m pytest tests/test_profanity_audit.py tests/test_analysis.py -q
      - name: Check original transcripts against every family and stored counts
        env:
          AUDIT_CONGRESS: ${{ matrix.congress }}
          SAVE_CANDIDATES: ${{ inputs.save_candidates }}
        run: |
          candidate_args=()
          if [[ "$SAVE_CANDIDATES" == "true" ]]; then
            candidate_args=(--candidate-out audit/candidates --source-out audit/originals)
            if [[ "$AUDIT_CONGRESS" -ge 115 ]]; then
              candidate_args+=(--aggregate-out audit/aggregates)
            fi
          fi
          python scripts/audit_profanity_families.py \
            --fetch-congress "$AUDIT_CONGRESS" \
            --out "audit/member-$AUDIT_CONGRESS" \
            "${candidate_args[@]}"
      - name: Retain checked candidate partition without publishing it
        if: ${{ success() && inputs.save_candidates }}
        uses: actions/upload-artifact@v4
        with:
          name: speaker-congress-${{ matrix.congress }}
          path: audit/candidates/congress_${{ matrix.congress }}.parquet
          if-no-files-found: error
          retention-days: 30
      - name: Retain independently checked modern aggregate metrics
        if: ${{ success() && inputs.save_candidates && matrix.congress >= 115 }}
        uses: actions/upload-artifact@v4
        with:
          name: aggregate-congress-${{ matrix.congress }}
          path: audit/aggregates/congress_${{ matrix.congress }}.parquet
          if-no-files-found: error
          retention-days: 30
      - name: Retain all match evidence, exclusions, and differences
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profanity-audit-member-${{ matrix.congress }}
          path: audit/
          if-no-files-found: error
          retention-days: 30
