name: Audit all profanity families

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profanity-source-audit
  cancel-in-progress: false

jobs:
  members:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        congress: [103, 104, 105, 106, 107, 108, 109, 110, 111, 112, 113, 114, 115, 116, 117, 118, 119]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "requirements*.txt"
      - run: pip install -r requirements-dev.txt
      - name: Test every codebook form and independent matcher
        run: python -m pytest tests/test_profanity_audit.py tests/test_analysis.py -q
      - name: Check original transcripts against every family and stored counts
        run: |
          python scripts/audit_profanity_families.py \
            --fetch-congress ${{ matrix.congress }} \
            --out audit/member-${{ matrix.congress }}
      - name: Retain all match evidence, exclusions, and differences
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profanity-audit-member-${{ matrix.congress }}
          path: audit/
          if-no-files-found: error
          retention-days: 30
