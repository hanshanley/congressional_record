name: Backfill all speaker profanity terms

on:
  workflow_dispatch:

concurrency:
  group: update-site
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-analysis.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Rescore all historical member partitions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for year in $(seq 1994 2024); do
            python scripts/update_speakers.py \
              --since "${year}-01-01" \
              --until "${year}-12-31"
            git add data/site/speaker_daily
            if ! git diff --cached --quiet; then
              git commit \
                -m "Rescore speaker profanity terms for ${year}" \
                -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>" \
                -m "Copilot-Session: 20de2f9c-02b3-4617-b28a-82ccd88b0490"
              git push
            fi
          done

      - name: Rebuild and commit site
        run: |
          python scripts/build_site.py
          git add site
          if git diff --cached --quiet; then
            echo "Site outputs are unchanged."
          else
            git commit \
              -m "Publish historical speaker profanity terms" \
              -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>" \
              -m "Copilot-Session: 20de2f9c-02b3-4617-b28a-82ccd88b0490"
            git push
          fi
