name: Backfill all speaker profanity terms

on:
  workflow_dispatch:
    inputs:
      congresses:
        description: JSON array of Congress numbers to rescore
        required: true
        default: "[103,104,105,106,107,108,109,110,111,112,113,114,115,116,117,118,119]"
        type: string
      source_run_id:
        description: "Recover publication using artifacts from a completed backfill run"
        required: false
        default: ""
        type: string

concurrency:
  group: update-site
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  backfill:
    if: ${{ inputs.source_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        congress: ${{ fromJSON(inputs.congresses) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-analysis.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Rescore Congress ${{ matrix.congress }}
        run: |
          start_year=$((1787 + 2 * ${{ matrix.congress }}))
          end_year=$((1788 + 2 * ${{ matrix.congress }}))
          if [ "${{ matrix.congress }}" -eq 103 ]; then
            start_year=1994
          fi
          for year in $(seq "${start_year}" "${end_year}"); do
            python scripts/update_speakers.py \
              --since "${year}-01-01" \
              --until "${year}-12-31"
          done

      - name: Upload Congress ${{ matrix.congress }}
        uses: actions/upload-artifact@v4
        with:
          name: speaker-congress-${{ matrix.congress }}
          path: data/site/speaker_daily/congress_${{ matrix.congress }}.parquet
          if-no-files-found: error

  publish:
    needs: backfill
    if: ${{ always() && !cancelled() && (needs.backfill.result == 'success' || (inputs.source_run_id != '' && needs.backfill.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-analysis.txt -r requirements-dev.txt

      - name: Download rescored partitions
        uses: actions/download-artifact@v4
        with:
          pattern: speaker-congress-*
          path: ${{ runner.temp }}/rescored-speakers
          merge-multiple: true
          run-id: ${{ inputs.source_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Validate historical term counts
        env:
          BACKFILL_CONGRESSES: ${{ inputs.congresses }}
          RESCORED_SPEAKERS: ${{ runner.temp }}/rescored-speakers
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import shutil

          import pandas as pd

          from analysis.speakers import incomplete_profanity_term_rows

          congresses = json.loads(os.environ["BACKFILL_CONGRESSES"])
          if (
              not isinstance(congresses, list)
              or not congresses
              or any(type(congress) is not int or congress < 103 for congress in congresses)
              or len(set(congresses)) != len(congresses)
          ):
              raise SystemExit("congresses must be a nonempty array of distinct Congress numbers >= 103")
          root = Path(os.environ["RESCORED_SPEAKERS"])
          for congress in congresses:
              path = root / f"congress_{congress}.parquet"
              frame = pd.read_parquet(path)
              if "slur_hits" not in frame or frame["slur_hits"].isna().any():
                  raise SystemExit(f"{path}: slur scoring is incomplete")
              incomplete = incomplete_profanity_term_rows(frame)
              if not incomplete.empty:
                  raise SystemExit(
                      f"{path}: {len(incomplete)} rows have inconsistent profanity terms"
                  )
          destination = Path("data/site/speaker_daily")
          destination.mkdir(parents=True, exist_ok=True)
          for congress in congresses:
              name = f"congress_{congress}.parquet"
              shutil.copy2(root / name, destination / name)
          PY
          python -m pytest tests/ -q

      - name: Rebuild and commit site
        run: |
          git config user.name "hanshanley"
          git config user.email "hwahhanley@gmail.com"
          git add data/site/speaker_daily
          if ! git diff --cached --quiet; then
            git commit -m "Publish rescored historical speaker language"
          fi

          for attempt in 1 2 3; do
            # Incorporate presentation changes before rendering the saved scores.
            git pull --rebase origin master
            python scripts/build_site.py
            python scripts/build_term_graphs.py
            git add site outputs/figures/profanity_terms
            if ! git diff --cached --quiet; then
              git commit -m "Rebuild site with historical speaker language"
            fi
            if [[ "$(git rev-list --count origin/master..HEAD)" -eq 0 ]]; then
              echo "Site outputs are unchanged."
              exit 0
            fi
            remote_head="$(git rev-parse origin/master)"
            if git push origin HEAD:master; then
              exit 0
            fi
            git fetch origin master
            if [[ "$(git rev-parse origin/master)" == "$remote_head" ]]; then
              echo "::error::Push failed without a concurrent branch update; publication stopped."
              exit 1
            fi
            echo "::warning::master advanced during publication attempt $attempt; rebuilding."
          done
          echo "::error::master kept advancing; publication did not finish after three attempts."
          exit 1
